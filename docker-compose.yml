version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: tiffin-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: tiffinDB
    volumes:
      - mongodb_data:/data/db

  # Backend API
  backend:
    build: ./backend
    container_name: tiffin-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://admin:password@mongodb:27017/tiffinDB?authSource=admin
      - JWT_SECRET=your_secret_key_here   # Change this!
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app          # Mount local backend code
      - /app/node_modules       # Keep container's node_modules

  # Frontend
  frontend:
    build: ./frontend
    container_name: tiffin-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api   # Browser will use this
    depends_on:
      - backend
    volumes:
      - ./frontend:/app         # Mount local frontend code
      - /app/node_modules       # Keep container's node_modules

volumes:
  mongodb_data:   # Persistent volume for database